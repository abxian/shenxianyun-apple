# 神仙云 Apple 客户端 · 站点与品牌配置（编译期身份）
#
# 与族内 PC / Android 的 site-profile.properties 同一范式：品牌、标识、地址集中一处，
# 改完跑 `python3 scripts/brand-apply.py` 重新注入，再重新生成工程并编译。
#
# ⚠ Bundle ID 家族、App Group、URL scheme 属编译期身份，改了必须重新编译才生效。
# ⚠ 复制出新品牌（如 52nm）时：整份复制本文件、换掉下面所有值，
#    尤其 bundle.base / url.scheme / app.name 三者必须与既有品牌两两不同，
#    否则同机并装会互相抢注册（族内 PC 线已有过这个教训）。

# ---- 身份 ----
profile.id=sxnn
bundle.base=de.sxnn.shenxianyun
# 留空 = 不签名构建。填 10 位 Apple Team ID 才能签名 / 上架。
development.team=

# ---- 展示名 ----
app.name=神仙云
app.name.extension=神仙云 内核
app.name.controls=神仙云 控制
app.name.share=导入到神仙云
icloud.container.name=神仙云

# ---- URL scheme ----
# 只注册自己的 scheme。上游默认还注册 clash / clashmeta / flclash / hako，
# 那会与真正的 Clash 应用抢系统注册，谁后装谁生效，行为不可预测——故丢弃。
# 若日后确需支持第三方 clash:// 导入链接，在这里追加（逗号分隔）并接受抢注册风险。
url.schemes=shenxianyun

# ---- 后端地址 ----
# 客户端只内置这一个引导地址，启动后一律以 /api/endpoints 下发的为准。
# 换线路改后台「地址/线路」即可，不需要发新版。
api.bootstrap=https://api.sxnn.de:5443

# ---- 不在这里配的东西 ----
# 权限说明文案：上游已做成本地化的 InfoPlist.strings（en / zh-Hans），
#   运行时以本地化为准，project.yml 里那份英文只是兜底。brand-apply.py 刻意不碰。
#   要改中文文案，直接改：
#     apple/HakoClient/Sources/AppArchitecture/AppLocalization/zh-Hans.lproj/InfoPlist.strings
#     apple/HakoClient/Resources/tvOS/Localization/zh-Hans.lproj/InfoPlist.strings
# 应用图标：apple/HakoClient/Resources/Branding/ 下的 xcassets，需要替换图片资源。
